name: Connect frontend client

on:
  push:
    branches: [mainai]

permissions:
  contents: write

jobs:
  connect-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add backend bridge script
        shell: bash
        run: |
          if ! grep -q 'client.js' index.html; then
            python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); p.write_text(s.replace('</body>', '<script src=\"client.js\"></script>\\n</body>'))"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Connect frontend to backend client'
            git push
          fi
